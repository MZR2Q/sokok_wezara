<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="شعار وزارة الشؤون الإسلامية">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cf62"/>
      <stop offset="1" stop-color="#8bb84a"/>
