    <path d="M200 410c-24-12-50-12-74-4v30c24-8 50-8 74 4z" fill="#ffffff" stroke="#2f6b2f" stroke-width="1.5"/>
    <path d="M200 410c24-12 50-12 74-4v30c-24-8-50-8-74 4z" fill="#f4f9ec" stroke="#2f6b2f" stroke-width="1.5"/>
