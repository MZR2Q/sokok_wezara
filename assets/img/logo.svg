    <path d="M200 104c-6 1-10 4-12 8 4-1 7-1 9 0-1-4 2-6 3-8z"/>
  </g>

  <!-- أشعة منبثقة نحو المصحف -->
  <g stroke="#8a6a2f" stroke-width="1.4" opacity="0.8">
    <line x1="200" y1="235" x2="128" y2="392"/>
    <line x1="200" y1="235" x2="150" y2="396"/>
    <line x1="200" y1="235" x2="175" y2="399"/>
    <line x1="200" y1="235" x2="200" y2="400"/>
    <line x1="200" y1="235" x2="225" y2="399"/>
    <line x1="200" y1="235" x2="250" y2="396"/>
    <line x1="200" y1="235" x2="272" y2="392"/>
