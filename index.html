<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام متابعة الصكوك — تسجيل الدخول</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link rel="stylesheet" href="assets/css/base.css?v=4" />
  <link rel="stylesheet" href="assets/css/components.css?v=4" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh;
      background:
        radial-gradient(1100px 500px at 80% -10%, rgba(11,107,59,.10), transparent),
        radial-gradient(900px 500px at 10% 110%, rgba(200,164,77,.12), transparent),
        var(--bg);
    }
    .login-wrap { width: 100%; max-width: 480px; padding: 24px; }
    .login-brand { text-align: center; margin-bottom: 26px; }
    .login-brand img { width: auto; height: 96px; }
    .login-brand h1 { margin-top: 14px; color: var(--brand-dark); }
    .login-brand .min { color: var(--ink-2); font-weight: 700; margin-top: 4px; }
    .login-brand .sub { color: var(--muted); font-size: .9rem; }
    .role-card {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      border: 2px solid var(--line); border-radius: var(--radius); cursor: pointer;
      transition: .16s; background: var(--surface); margin-bottom: 12px;
    }
    .role-card:hover { border-color: var(--brand-100); transform: translateY(-1px); box-shadow: var(--shadow); }
    .role-card.sel { border-color: var(--brand); background: var(--brand-050); }
    .role-card .r-ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
      background: var(--brand-050); color: var(--brand-dark); font-size: 1.4rem; flex-shrink: 0; }
    .role-card b { display: block; }
    .role-card p { font-size: .82rem; color: var(--muted); margin: 0; }
    .role-card .r-check { margin-inline-start: auto; color: var(--brand); font-size: 1.3rem; opacity: 0; }
    .role-card.sel .r-check { opacity: 1; }
    .ctx-picker { margin-top: 4px; }
    .foot-note { text-align: center; margin-top: 18px; color: var(--muted); font-size: .78rem; }
    @media (max-width: 480px) {
      .login-wrap { padding: 16px; }
      .login-brand img { width: auto; height: 78px; }
      .login-brand h1 { font-size: 1.35rem; }
      .login-brand .min { font-size: .9rem; }
      .role-card { padding: 13px; gap: 11px; }
      .role-card .r-ic { width: 42px; height: 42px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <img src="assets/img/logo.png" alt="شعار الوزارة" onerror="this.onerror=null;this.src='assets/img/logo.svg'" />
      <div class="min">وزارة الشؤون الإسلامية والدعوة والإرشاد</div>
      <h1>نظام متابعة الصكوك</h1>
      <div class="sub">توثيق ومتابعة صكوك المساجد على مستوى الفروع</div>
    </div>

    <div class="card card-pad">
      <label class="small muted" style="font-weight:700">اختر صلاحية الدخول</label>
      <div id="roles" class="mt-1"></div>

      <div class="field ctx-picker hidden" id="ctxWrap">
        <label id="ctxLabel">اختر الجهة</label>
        <select class="select" id="ctxSelect"></select>
      </div>

      <button class="btn primary block mt-2" id="loginBtn" disabled>دخول النظام ←</button>
    </div>

    <div class="foot-note">نموذج أولي (Prototype) — البيانات تجريبية وتُحفظ في متصفحك فقط.</div>
  </div>

  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/store.js?v=4"></script>
  <script src="assets/js/utils.js?v=4"></script>
  <script src="assets/js/icons.js?v=4"></script>
  <script src="assets/js/anim.js?v=4"></script>
  <script src="assets/js/login.js?v=4"></script>
</body>
</html>
